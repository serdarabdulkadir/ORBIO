name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem or need}
    validations: {required: true}
  - type: textarea
    id: idea
    attributes: {label: Proposed solution}
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Android, Both, Not sure]
  - type: textarea
    id: alt
    attributes: {label: Alternatives considered}
